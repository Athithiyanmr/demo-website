<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NREDCAP AI Land Allocation Platform – Anantapur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1222; --bg2: #131d2e; --bg3: #0a0f1a;
  --surface: #172033; --surface2: #1c2a40;
  --accent: #38bdf8; --accent2: #0ea5e9; --accent-soft: rgba(56,189,248,0.08);
  --green: #22c55e; --green-soft: rgba(34,197,94,0.1);
  --yellow: #eab308; --yellow-soft: rgba(234,179,8,0.1);
  --red: #ef4444; --red-soft: rgba(239,68,68,0.1);
  --orange: #f97316; --purple: #a855f7;
  --text: #f1f5f9; --text2: #e2e8f0; --muted: #64748b; --muted2: #94a3b8;
  --border: #1e2d44; --border2: #293a52;
  --radius: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.5);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ── Navbar ── */
.navbar { background:var(--bg3); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:52px; flex-shrink:0; z-index:1000; }
.nav-brand { display:flex; align-items:center; gap:12px; }
.nav-logo { width:34px; height:34px; background:linear-gradient(135deg, var(--accent), #0284c7); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.nav-logo svg { width:18px; height:18px; }
.nav-title { font-size:14px; font-weight:700; color:var(--text); letter-spacing:-0.02em; }
.nav-subtitle { font-size:10px; color:var(--muted); font-weight:500; letter-spacing:0.03em; }
.nav-tabs { display:flex; gap:2px; background:var(--surface); border-radius:8px; padding:3px; }
.nav-tab { padding:6px 16px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; border:none; background:transparent; color:var(--muted2); transition:var(--transition); letter-spacing:-0.01em; }
.nav-tab.active { background:var(--accent); color:#0b1222; box-shadow:0 2px 8px rgba(56,189,248,0.3); }
.nav-tab:hover:not(.active) { color:var(--text); }
.nav-right { display:flex; align-items:center; gap:12px; font-size:11px; color:var(--muted); }

/* ── Main Layout ── */
.main { display:flex; flex:1; overflow:hidden; }
.hidden { display:none !important; }

/* ── Sidebar ── */
.sidebar { width:340px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-header h3 { font-size:13px; color:var(--accent); font-weight:700; margin-bottom:3px; letter-spacing:-0.01em; }
.sidebar-header p { font-size:11px; color:var(--muted); }
.sidebar-body { flex:1; overflow-y:auto; padding:16px; }
.sidebar-body::-webkit-scrollbar { width:3px; }
.sidebar-body::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* ── Form Controls ── */
.form-group { margin-bottom:14px; }
.form-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; display:block; }
.form-control { width:100%; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:var(--transition); }
.form-control:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,0.1); }
.form-control option { background:var(--bg2); }
.btn { padding:9px 18px; border-radius:var(--radius); border:none; cursor:pointer; font-size:12px; font-weight:700; transition:var(--transition); width:100%; font-family:inherit; letter-spacing:-0.01em; }
.btn-primary { background:var(--accent); color:#0b1222; }
.btn-primary:hover { background:var(--accent2); box-shadow:0 2px 12px rgba(56,189,248,0.3); }
.btn-secondary { background:transparent; border:1px solid var(--border); color:var(--muted2); margin-top:8px; }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

/* ── Score Card ── */
.score-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-top:16px; }
.score-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.score-title { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
.score-badge { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:0.03em; }
.score-high { background:var(--green-soft); color:var(--green); border:1px solid rgba(34,197,94,0.25); }
.score-medium { background:var(--yellow-soft); color:var(--yellow); border:1px solid rgba(234,179,8,0.25); }
.score-low { background:var(--red-soft); color:var(--red); border:1px solid rgba(239,68,68,0.25); }
.score-number { font-size:42px; font-weight:800; color:var(--accent); text-align:center; margin:8px 0 2px; letter-spacing:-0.04em; }
.score-sub { text-align:center; font-size:10px; color:var(--muted); margin-bottom:14px; }
.progress-bar-wrap { margin-bottom:10px; }
.progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted2); margin-bottom:4px; }
.progress-track { height:5px; background:var(--bg); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; transition:width 1s cubic-bezier(0.4, 0, 0.2, 1); }
.fill-green { background:var(--green); }
.fill-blue { background:var(--accent); }
.fill-yellow { background:var(--yellow); }
.fill-orange { background:var(--orange); }
.conflict-list { margin-top:12px; }
.conflict-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; margin-bottom:5px; font-size:11px; font-weight:500; }
.conflict-ok { background:var(--green-soft); color:var(--green); }
.conflict-warn { background:var(--yellow-soft); color:var(--yellow); }
.conflict-err { background:var(--red-soft); color:var(--red); }
.conflict-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.dot-green { background:var(--green); }
.dot-yellow { background:var(--yellow); }
.dot-red { background:var(--red); }

/* ── Map ── */
#map { flex:1; }

/* ── Tabs ── */
.stab-row { display:flex; gap:3px; margin-bottom:14px; background:var(--surface); border-radius:var(--radius); padding:3px; }
.stab { flex:1; padding:6px; text-align:center; font-size:11px; font-weight:600; border-radius:6px; cursor:pointer; background:transparent; color:var(--muted); border:none; transition:var(--transition); }
.stab.active { background:var(--accent-soft); color:var(--accent); }

/* ── Layer Toggles ── */
.layer-section-title { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin:14px 0 8px; display:flex; align-items:center; gap:6px; }
.layer-section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.layer-toggles { margin-top:4px; }
.layer-toggle { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; background:var(--surface); border:1px solid var(--border); border-radius:6px; margin-bottom:5px; cursor:pointer; font-size:11px; color:var(--text2); transition:var(--transition); gap:8px; }
.layer-toggle:hover { border-color:var(--border2); }
.layer-toggle-label { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
.layer-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.toggle-switch { width:30px; height:16px; border-radius:8px; position:relative; transition:var(--transition); flex-shrink:0; background:var(--border2); }
.toggle-switch.on { background:var(--accent); }
.toggle-knob { position:absolute; top:2px; left:2px; width:12px; height:12px; background:#fff; border-radius:50%; transition:var(--transition); }
.toggle-switch.on .toggle-knob { left:16px; }

/* ── Stats Bar ── */
.stats-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:14px; }
.stat-mini { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px; text-align:center; }
.stat-mini-num { font-size:18px; font-weight:800; color:var(--accent); letter-spacing:-0.03em; }
.stat-mini-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin-top:2px; }

/* ── Legend ── */
.legend { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-top:14px; }
.legend-title { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text2); margin-bottom:5px; }
.legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.info-box { background:var(--accent-soft); border:1px solid rgba(56,189,248,0.15); border-radius:var(--radius); padding:12px; margin-top:12px; font-size:11px; color:var(--muted2); line-height:1.6; }
.info-box strong { color:var(--accent); }

/* ── Loading Indicator ── */
.layer-loading { display:inline-block; width:8px; height:8px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin-left:auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Officer Panel ── */
.officer-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.officer-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--bg2); }
.officer-header h3 { font-size:14px; font-weight:700; letter-spacing:-0.02em; }
.officer-header p { font-size:11px; color:var(--muted); margin-top:2px; }
.officer-stats { display:flex; gap:20px; }
.stat-pill { text-align:center; }
.stat-num { font-size:20px; font-weight:800; color:var(--accent); letter-spacing:-0.03em; }
.stat-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }

/* ── Table ── */
.table-wrap { flex:1; overflow-y:auto; padding:0 24px 24px; }
.table-wrap::-webkit-scrollbar { width:3px; }
.table-wrap::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
thead th { padding:12px 12px; text-align:left; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:1; }
tbody td { padding:10px 12px; border-bottom:1px solid rgba(30,45,68,0.5); vertical-align:middle; }
